name: data-pipeline

on:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/data.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache data mentah
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Install
        run: pip install -r scripts/requirements.txt
      - name: Run pipeline
        env:
          CMEMS_USERNAME: ${{ secrets.CMEMS_USERNAME }}
          CMEMS_PASSWORD: ${{ secrets.CMEMS_PASSWORD }}
        run: |
          mkdir -p data/derived
          bash scripts/run_all.sh 2>&1 | tee data/derived/last_run.log
      - name: Commit derived data
        run: |
          git config user.name "seroja-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/derived data/raw_small || true
          git commit -m "data: hasil pipeline $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git pull --rebase origin main || true
          git push || true
